# Publish a release when the maintainer pushes a v* tag (TKT-01M3YSVEDJ).
#
# This file is a maintainer grant beyond docs/12 "Changing CI", for this file
# only (docs/15 "Decided by the maintainer", 2026-10-02): a new workflow, a
# tag trigger, and the write permission an upload needs. It is not a required
# check. Nothing in the repository triggers it, and no agent pushes a tag or
# creates, reads or tests the secrets it uses (docs/15, stop class 3).
#
# Three jobs:
#   forgejo  builds the binaries with tools/release, which makes the same
#            assertions as the CI dry run (static, CGO_ENABLED=0, no tags, no
#            cgo dependency, the version and commit stamped), and publishes
#            them with SHA256SUMS as a release on this Forgejo. It then
#            downloads the release anonymously and checks it with sha256sum -c.
#   github   publishes the same files, downloaded from the Forgejo release and
#            checked, as a release on the public mirror github.com/terva-sh/ketju.
#   image    builds a scratch image from the same files for linux/amd64 and
#            linux/arm64, and pushes it to container.local.sothr.com/terva-sh/ketju
#            as the version, and as `latest` unless the tag is a pre-release.
# v1.0 is not signed (the maintainer's decision).
#
# The secrets, which the maintainer creates; the README's "Publishing a
# release" names them too, and a test keeps the two lists equal:
#   RELEASE_FORGEJO_TOKEN         a Forgejo token that can create releases on
#                                 terva-sh/ketju (repository: read and write)
#   RELEASE_GITHUB_TOKEN          a GitHub fine-grained token for
#                                 terva-sh/ketju with contents: read and write
#   CONTAINER_PUSH_REPO_USER      the registry account (a secret, or an Actions
#                                 variable of the same name)
#   CONTAINER_PUSH_REPO_PASSWORD  its password, with push access to the
#                                 terva-sh project on container.local.sothr.com
# The last two are the names every repository on this instance uses for the
# registry (terva-action-code-review's container.yml).
#
# Every value reaches a script through `env:`, never as an expression pasted
# into it: an expression is substituted as source before the shell parses it,
# so a ref or a secret holding a quote or `$(...)` would become syntax. A
# token is handed to curl on its standard input (`-K -`), never on a command
# line, and no step runs with `set -x`.
#
# SHA256SUMS is read with `cut -d' ' -f3`: its lines are sha256sum's
# "<digest>  <name>", two spaces, and names hold no space.
#
# A rerun is safe. A release that already exists is reused, an asset already
# uploaded is kept if its digest is the one SHA256SUMS lists, and the run fails
# if it is not: a version is published once, with one set of bytes.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MIRROR_REPOSITORY: terva-sh/ketju
  IMAGE: container.local.sothr.com/terva-sh/ketju

jobs:
  forgejo:
    name: Build, check and publish to Forgejo
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.27-alpine
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Install dependencies
        run: apk add --no-cache git curl jq

      - name: Checkout the tag
        uses: Actions-Mirrors/forgejo-actions-checkout@v6
        with:
          # Every branch, so the tag can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          TAG="${REF#refs/tags/}"
          # vMAJOR.MINOR[.PATCH][-PRERELEASE]: what tools/release can stamp
          # and an image tag can carry.
          if ! printf '%s\n' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag ${TAG} is not vMAJOR.MINOR[.PATCH][-PRERELEASE]"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${SHA}" ]; then
            echo "::error::the checkout is $(git rev-parse HEAD), not the tagged ${SHA}"
            exit 1
          fi
          # A release is cut from main: a tag on another branch is refused.
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "::error::${TAG} (${SHA}) is not on main"
            exit 1
          fi
          case "${TAG}" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${TAG} from ${SHA} (pre-release: ${PRERELEASE})"

      - name: Build and check the binaries
        # The same command as CI's "release dry run" step, with the tag as the
        # version. It refuses a dirty tree, and its output goes outside the
        # checkout.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          go run ./tools/release --version "${TAG}" --out /tmp/ketju-release
          cd /tmp/ketju-release
          sha256sum -c SHA256SUMS

      - name: Publish the Forgejo release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.RELEASE_FORGEJO_TOKEN }}
        run: |
          set -eu
          if [ -z "${FORGEJO_TOKEN:-}" ]; then
            echo "::error::RELEASE_FORGEJO_TOKEN is not available to this repository"
            echo "It is a Forgejo token that can create releases on ${REPOSITORY}. The README's"
            echo "\"Publishing a release\" section says what each release secret is."
            exit 1
          fi
          API="${SERVER}/api/v1/repos/${REPOSITORY}"
          DIST=/tmp/ketju-release
          # The token goes to curl on stdin as a config line, never in argv.
          api() { printf 'header = "Authorization: token %s"\n' "${FORGEJO_TOKEN}" | curl -sS -K - "$@"; }

          if [ -f "docs/releases/${TAG}.md" ]; then
            BODY_FILE="docs/releases/${TAG}.md"
          else
            BODY_FILE=/tmp/ketju-release-body.md
            printf 'ketju %s. Release notes are in docs/releases/ at this tag.\n' "${TAG}" > "${BODY_FILE}"
          fi

          code=$(api -o /tmp/release.json -w '%{http_code}' "${API}/releases/tags/${TAG}")
          case "${code}" in
            200)
              echo "The release for ${TAG} exists; reusing it."
              ;;
            404)
              jq -n --arg tag "${TAG}" --rawfile body "${BODY_FILE}" --argjson pre "${PRERELEASE}" \
                '{tag_name: $tag, name: $tag, body: $body, draft: false, prerelease: $pre}' > /tmp/create.json
              code=$(api -o /tmp/release.json -w '%{http_code}' -X POST \
                -H 'Content-Type: application/json' --data @/tmp/create.json "${API}/releases")
              if [ "${code}" != 201 ]; then
                echo "::error::creating the release answered ${code}"
                cat /tmp/release.json
                exit 1
              fi
              ;;
            *)
              echo "::error::reading the release for ${TAG} answered ${code}"
              cat /tmp/release.json
              exit 1
              ;;
          esac
          ID=$(jq -r .id /tmp/release.json)

          # Each file SHA256SUMS lists, then SHA256SUMS itself. An asset that
          # is already there is kept only if its digest is the listed one.
          for name in $(cut -d' ' -f3 "${DIST}/SHA256SUMS") SHA256SUMS; do
            url=$(jq -r --arg n "${name}" '.assets[] | select(.name == $n) | .browser_download_url' /tmp/release.json)
            if [ -n "${url}" ]; then
              curl -fsSL -o /tmp/existing "${url}"
              if ! cmp -s /tmp/existing "${DIST}/${name}"; then
                echo "::error::${name} is already published on ${TAG} with other bytes; a version is published once"
                exit 1
              fi
              echo "${name} is already published, with the same bytes."
              continue
            fi
            code=$(api -o /tmp/asset.json -w '%{http_code}' -X POST \
              -F "attachment=@${DIST}/${name}" "${API}/releases/${ID}/assets?name=${name}")
            if [ "${code}" != 201 ]; then
              echo "::error::uploading ${name} answered ${code}"
              cat /tmp/asset.json
              exit 1
            fi
            echo "Uploaded ${name}."
          done

      - name: Check the Forgejo release as a downloader would
        # Anonymously, into an empty directory: what someone installing the
        # release does (README "Installing a release").
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          DIR=$(mktemp -d)
          cd "${DIR}"
          BASE="${SERVER}/${REPOSITORY}/releases/download/${TAG}"
          curl -fsSL -o SHA256SUMS "${BASE}/SHA256SUMS"
          for name in $(cut -d' ' -f3 SHA256SUMS); do
            curl -fsSL -o "${name}" "${BASE}/${name}"
          done
          sha256sum -c SHA256SUMS

  github:
    name: Publish to the GitHub mirror
    needs: forgejo
    runs-on: docker
    container:
      image: container.local.sothr.com/library/golang:1.27-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache curl jq

      - name: Download and check the Forgejo release
        env:
          TAG: ${{ needs.forgejo.outputs.tag }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p /tmp/ketju-release
          cd /tmp/ketju-release
          BASE="${SERVER}/${REPOSITORY}/releases/download/${TAG}"
          curl -fsSL -o SHA256SUMS "${BASE}/SHA256SUMS"
          for name in $(cut -d' ' -f3 SHA256SUMS); do
            curl -fsSL -o "${name}" "${BASE}/${name}"
          done
          sha256sum -c SHA256SUMS
          curl -fsSL -o /tmp/forgejo-release.json "${SERVER}/api/v1/repos/${REPOSITORY}/releases/tags/${TAG}"

      - name: Publish the GitHub release
        env:
          TAG: ${{ needs.forgejo.outputs.tag }}
          PRERELEASE: ${{ needs.forgejo.outputs.prerelease }}
          SHA: ${{ github.sha }}
          GITHUB_RELEASE_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -z "${GITHUB_RELEASE_TOKEN:-}" ]; then
            echo "::error::RELEASE_GITHUB_TOKEN is not available to this repository"
            echo "It is a GitHub fine-grained token for ${MIRROR_REPOSITORY} with contents: read"
            echo "and write. The README's \"Publishing a release\" section says what each"
            echo "release secret is."
            exit 1
          fi
          API="https://api.github.com/repos/${MIRROR_REPOSITORY}"
          DIST=/tmp/ketju-release
          gh() {
            printf 'header = "Authorization: Bearer %s"\n' "${GITHUB_RELEASE_TOKEN}" | curl -sS -K - \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@"
          }

          # The mirror receives the release commit and the tag by the
          # maintainer's push (README "The name, and where this lives"), which
          # may come after this run starts. Wait up to 30 minutes for the tag,
          # and refuse one that names another commit.
          found=""
          for i in $(seq 1 30); do
            code=$(gh -o /tmp/ref.json -w '%{http_code}' "${API}/git/ref/tags/${TAG}")
            if [ "${code}" = 200 ]; then found=yes; break; fi
            echo "The mirror has no tag ${TAG} yet (${code}); waiting a minute (${i}/30)."
            sleep 60
          done
          if [ -z "${found}" ]; then
            echo "::error::github.com/${MIRROR_REPOSITORY} has no tag ${TAG}"
            echo "Push main and ${TAG} to the mirror, then rerun this job."
            exit 1
          fi
          OBJ=$(jq -r .object.sha /tmp/ref.json)
          if [ "$(jq -r .object.type /tmp/ref.json)" = tag ]; then
            gh -f -o /tmp/tagobj.json "${API}/git/tags/${OBJ}"
            OBJ=$(jq -r .object.sha /tmp/tagobj.json)
          fi
          if [ "${OBJ}" != "${SHA}" ]; then
            echo "::error::${TAG} on the mirror is ${OBJ}, not ${SHA} as on this forge"
            exit 1
          fi

          code=$(gh -o /tmp/release.json -w '%{http_code}' "${API}/releases/tags/${TAG}")
          case "${code}" in
            200)
              echo "The mirror's release for ${TAG} exists; reusing it."
              ;;
            404)
              jq --arg tag "${TAG}" --argjson pre "${PRERELEASE}" \
                '{tag_name: $tag, name: $tag, body: .body, draft: false, prerelease: $pre}' \
                /tmp/forgejo-release.json > /tmp/create.json
              code=$(gh -o /tmp/release.json -w '%{http_code}' -X POST --data @/tmp/create.json "${API}/releases")
              if [ "${code}" != 201 ]; then
                echo "::error::creating the mirror's release answered ${code}"
                cat /tmp/release.json
                exit 1
              fi
              ;;
            *)
              echo "::error::reading the mirror's release for ${TAG} answered ${code}"
              cat /tmp/release.json
              exit 1
              ;;
          esac
          ID=$(jq -r .id /tmp/release.json)

          for name in $(cut -d' ' -f3 "${DIST}/SHA256SUMS") SHA256SUMS; do
            url=$(jq -r --arg n "${name}" '.assets[] | select(.name == $n) | .browser_download_url' /tmp/release.json)
            if [ -n "${url}" ]; then
              curl -fsSL -o /tmp/existing "${url}"
              if ! cmp -s /tmp/existing "${DIST}/${name}"; then
                echo "::error::${name} is already on the mirror's ${TAG} with other bytes; a version is published once"
                exit 1
              fi
              echo "${name} is already on the mirror, with the same bytes."
              continue
            fi
            code=$(gh -o /tmp/asset.json -w '%{http_code}' -X POST -H 'Content-Type: application/octet-stream' \
              --data-binary "@${DIST}/${name}" \
              "https://uploads.github.com/repos/${MIRROR_REPOSITORY}/releases/${ID}/assets?name=${name}")
            if [ "${code}" != 201 ]; then
              echo "::error::uploading ${name} to the mirror answered ${code}"
              cat /tmp/asset.json
              exit 1
            fi
            echo "Uploaded ${name} to the mirror."
          done

      - name: Check the GitHub release as a downloader would
        env:
          TAG: ${{ needs.forgejo.outputs.tag }}
        run: |
          set -eu
          DIR=$(mktemp -d)
          cd "${DIR}"
          BASE="https://github.com/${MIRROR_REPOSITORY}/releases/download/${TAG}"
          curl -fsSL -o SHA256SUMS "${BASE}/SHA256SUMS"
          for name in $(cut -d' ' -f3 SHA256SUMS); do
            curl -fsSL -o "${name}" "${BASE}/${name}"
          done
          sha256sum -c SHA256SUMS

  image:
    name: Build and push the image
    needs: forgejo
    runs-on: docker
    container:
      # The instance's buildah image, with both options it needs: the fuse
      # device for overlayfs, and an unconfined seccomp profile for buildah's
      # mount calls (the convention terva-action-code-review's container.yml
      # documents).
      image: container.local.sothr.com/library/buildah:latest
      options: --device=/dev/fuse --security-opt seccomp=unconfined
    steps:
      - name: Checkout the tag
        uses: Actions-Mirrors/forgejo-actions-checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        # The buildah image is Fedora-based; curl is usually there already.
        run: command -v curl >/dev/null || dnf install -y curl

      - name: Download and check the Forgejo release
        # The image is built from the published binaries, not from a rebuild.
        env:
          TAG: ${{ needs.forgejo.outputs.tag }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p /tmp/ketju-image
          cd /tmp/ketju-image
          BASE="${SERVER}/${REPOSITORY}/releases/download/${TAG}"
          curl -fsSL -o SHA256SUMS "${BASE}/SHA256SUMS"
          for name in $(cut -d' ' -f3 SHA256SUMS); do
            curl -fsSL -o "${name}" "${BASE}/${name}"
          done
          sha256sum -c SHA256SUMS
          chmod 0755 ketju_*

      - name: Build the image for both platforms
        # Only COPY steps run for the target platform, so neither platform
        # needs an emulator; the one RUN is in a stage on the build platform.
        env:
          TAG: ${{ needs.forgejo.outputs.tag }}
        run: |
          set -eu
          for arch in amd64 arm64; do
            buildah build \
              --platform "linux/${arch}" \
              --build-arg "VERSION=${TAG}" \
              --tag "localhost/ketju-release:${TAG}-${arch}" \
              --file Dockerfile \
              /tmp/ketju-image
            got=$(buildah inspect --type image --format '{{.OCIv1.Architecture}} {{.OCIv1.Config.User}}' \
              "localhost/ketju-release:${TAG}-${arch}")
            if [ "${got}" != "${arch} 65532:65532" ]; then
              echo "::error::the ${arch} image is '${got}', want '${arch} 65532:65532'"
              exit 1
            fi
          done

      - name: Smoke test the image
        # The runner's own platform only: the other would need an emulator.
        env:
          TAG: ${{ needs.forgejo.outputs.tag }}
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          CONTAINER=$(buildah from "localhost/ketju-release:${TAG}-${arch}")
          trap 'buildah rm "${CONTAINER}" >/dev/null 2>&1 || true' EXIT
          line=$(buildah run "${CONTAINER}" -- /ketju version)
          echo "${line}"
          case "${line}" in
            *" ${TAG} (commit "*) ;;
            *) echo "::error::the image's ketju version does not name ${TAG}"; exit 1 ;;
          esac

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ secrets.CONTAINER_PUSH_REPO_USER }}
          REGISTRY_USER_VAR: ${{ vars.CONTAINER_PUSH_REPO_USER }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_PUSH_REPO_PASSWORD }}
        run: |
          set -eu
          REGISTRY_USER="${REGISTRY_USER:-${REGISTRY_USER_VAR:-}}"
          MISSING=""
          [ -n "${REGISTRY_USER:-}" ] || MISSING="CONTAINER_PUSH_REPO_USER"
          [ -n "${REGISTRY_PASSWORD:-}" ] || MISSING="${MISSING:+${MISSING} and }CONTAINER_PUSH_REPO_PASSWORD"
          if [ -n "${MISSING}" ]; then
            echo "::error::${MISSING} not available to this repository"
            echo "They are the registry account with push access to the terva-sh project on"
            echo "container.local.sothr.com. The README's \"Publishing a release\" section says"
            echo "what each release secret is."
            exit 1
          fi
          printf '%s' "${REGISTRY_PASSWORD}" | \
            buildah login container.local.sothr.com --username "${REGISTRY_USER}" --password-stdin

      - name: Push the image
        # One manifest list for both platforms, as the version, and as
        # `latest` unless the tag is a pre-release.
        env:
          TAG: ${{ needs.forgejo.outputs.tag }}
          PRERELEASE: ${{ needs.forgejo.outputs.prerelease }}
        run: |
          set -eu
          LIST="localhost/ketju-release:${TAG}"
          buildah manifest create "${LIST}"
          for arch in amd64 arm64; do
            buildah manifest add "${LIST}" "containers-storage:localhost/ketju-release:${TAG}-${arch}"
          done
          buildah manifest push --all "${LIST}" "docker://${IMAGE}:${TAG}"
          echo "Pushed ${IMAGE}:${TAG}."
          if [ "${PRERELEASE}" = false ]; then
            buildah manifest push --all "${LIST}" "docker://${IMAGE}:latest"
            echo "Pushed ${IMAGE}:latest."
          fi
