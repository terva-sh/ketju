# Forgejo CI: build, gofmt, vet, the suite under the race detector, and
# `git ticket check --fix --dry-run --strict` over this repository's ticket
# store. TKT-01M29BW9QP.
#
# Conventions come from the other Go repositories on this instance, and the
# ones that are not obvious are the ones that fail before a single step runs.
#
# Actions resolve against THIS Forgejo, not GitHub. A bare `actions/checkout@v4`
# is fetched from this instance's own actions/checkout path and 404s, so
# checkout comes from the public mirror org instead. Go comes from the internal
# registry's golang image rather than `setup-go`, which would fail the same way
# for the same reason.
#
# The image below names the internal registry, and it has to: it is a working
# reference, not prose.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# One pin, so a bump is a single reviewed line. `go install` resolves this
# through the public proxy and sum.golang.org verifies it, the same trust the
# `go mod download` step already relies on.
env:
  GIT_TICKET_VERSION: v0.18.0

jobs:
  ci:
    name: Build and Test
    runs-on: docker
    container:
      # 1.27, not the 1.25-alpine that most repositories on this instance use:
      # go.mod requires go 1.26.2, which 1.25 cannot build at all. This tag is
      # proven here by terva. The registry mirror is curated — do not assume an
      # arbitrary library/* image is present.
      image: container.local.sothr.com/library/golang:1.27-alpine
    steps:
      - name: Install dependencies
        # git for the checkout. gcc and musl-dev are cgo, which -race needs on
        # alpine; without them the race step fails to LINK, which reads as a
        # broken toolchain rather than a missing one.
        run: apk add --no-cache git gcc musl-dev

      - name: Checkout Code
        uses: Actions-Mirrors/forgejo-actions-checkout@v6

      - name: Download modules
        # Explicit, so a network problem fails here with a clear message rather
        # than inside the first step that happens to compile something.
        run: go mod download

      - name: gofmt check
        # gofmt -l exits zero whether or not it printed anything, so the file
        # list is the test. tee sends it to the log as well as the check.
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: build
        # There is no cmd/ yet, so "build the binary" is today "compile every
        # package". When cmd/ketju lands this step covers it with no edit.
        run: go build ./...

      - name: generated database code is current
        # TKT-01M29BW9Q1. sqlc compiles internal/store/db/queries against the
        # migrations into package dbq, and the committed output is what ships.
        # Regenerate it and fail on any difference, including a file sqlc
        # would add or remove, so a query or migration edited without
        # regenerating cannot merge. The same run regenerates the parse smoke
        # under testdata/smoke/, so a sqlc upgrade that stops parsing a
        # construct the schema relies on fails here.
        #
        # CGO_ENABLED=0 on purpose: sqlc v1.31.1 parses through WebAssembly,
        # and this proves it keeps doing so.
        env:
          CGO_ENABLED: "0"
        run: |
          go generate ./internal/store/db
          git add -N internal/store/db
          git diff --exit-code -- internal/store/db

      - name: Install Node
        # TKT-01M29CCC02. The client build below needs Node and npm; Vite 8
        # wants Node 20.19+ or 22.12+. A separate step rather than a longer
        # apk line above, because docs/12 lets a run add steps to this job and
        # not edit the ones it has.
        run: |
          apk add --no-cache nodejs npm
          node --version
          npm --version

      - name: built client is current
        # TKT-01M29CCC02. internal/web/spa/dist is committed, so that `go
        # build` alone serves the client, and it must be exactly what
        # web/client builds to. Rebuild it from the lockfile and fail on any
        # difference, including a file the build would add or remove.
        run: |
          go generate ./internal/web/spa
          git add -N internal/web/spa/dist
          git diff --exit-code -- internal/web/spa/dist

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        # The suite is seconds, so there is no reason to run the cheap version.
        # The storage property and crash tests arrive within weeks and they are
        # exactly the kind that pass locally and fail on another filesystem.
        run: go test -race ./...

      - name: fuzz the frame parser, body decoder and id parser (bounded)
        # TKT-01M29C2WTV. The parser reads a length off disk and sizes work
        # from it, so a hostile or corrupt length must be refused before it is
        # trusted; a panic there takes down the process for every thread, not
        # just the damaged one.
        #
        # TKT-01M29BW9PJ adds the id parser, which reads a URL path segment —
        # the least trusted input in the system. It checks the round trip as
        # well as the absence of a panic, so a form that is accepted but
        # re-encodes to something else is a failure rather than a curiosity.
        #
        # 20s each, not "until it finds something". A fuzz step with no time
        # bound is a build that hangs, and one that runs for minutes is a build
        # people learn to skip. This is a regression gate on a committed
        # corpus, not a discovery run — discovery is somebody running it for an
        # hour on a laptop and committing what it finds.
        #
        # Two invocations because `go test -fuzz` takes exactly one target per
        # run. -run '^$' stops the rest of the suite running again inside each.
        #
        # Note that -race is deliberately absent: the race detector slows the
        # fuzzer by roughly an order of magnitude, which buys far fewer
        # executions for the same wall clock. The suite above already runs
        # every deterministic test under -race.
        #
        # The committed corpus in testdata/fuzz/ replays on every ordinary
        # `go test` too, so a crash found once is a regression test forever,
        # whether or not this step runs.
        run: |
          go test ./internal/store/threadlog/ -run '^$' -fuzz FuzzParseFrame -fuzztime=20s
          go test ./internal/store/threadlog/ -run '^$' -fuzz FuzzDecodeBody -fuzztime=20s
          go test ./internal/store/threadid/  -run '^$' -fuzz FuzzParse      -fuzztime=20s

      - name: replay equivalence over random record sequences
        # TKT-01M29C2WT7. The index is built two ways — replayed from the log,
        # and maintained incrementally by the actor — and the design is only
        # sound if they agree. A divergence is silent in production until
        # somebody opens a thread and finds a post that will not load.
        #
        # The suite runs at its default bound inside the -race step above. This
        # is the wider sweep: more sequences, longer ones, no -race, a few
        # seconds. A failure prints the generating sequence and the exact flags
        # to reproduce it.
        run: |
          go test ./internal/store/threadlog/ -run TestReplayEqualsIncrementalMaintenance \
            -prop.cases=5000 -prop.len=120

      - name: storage benchmarks still run (not a measurement)
        # TKT-01M29C2WV6. One iteration of each benchmark at a toy size, to
        # catch a benchmark that stopped compiling or started failing. It is
        # explicitly NOT a measurement: a CI runner's filesystem is shared,
        # throttled and frequently tmpfs, so --bench.allow-volatile-fs is
        # passed and every number this step prints is meaningless.
        #
        # The real figures are taken on a named machine and recorded on the
        # ticket. See the header of bench_test.go for the command.
        run: |
          go test ./internal/store/threadlog/ -run '^$' -bench 'Benchmark' \
            -benchtime=1x -bench.posts=2000 -bench.rebuildmb=4 \
            -bench.dir="$(mktemp -d)" -bench.allow-volatile-fs -timeout=10m

      - name: build the format spike
        # spikes/format-decisions/ is a SEPARATE module, so the ./... above
        # never reaches it and it can rot without anyone finding out. Its README
        # says decision 1 is expected to be reopened when json/v2 lands, and a
        # spike that no longer compiles is a decision nobody can reopen.
        #
        # Build and vet only. Its tests are measurement reports rather than
        # assertions — TestFsyncLatency times an fsync and TestIndexWidthReport
        # builds a 114 MB log — so running them here would report the runner's
        # disk and gate nothing.
        run: |
          go -C spikes/format-decisions build ./...
          go -C spikes/format-decisions vet ./...

      - name: check the SQLite driver spike
        # TKT-01M29BSPE8. spikes/sqlite-driver/ is also a separate module, and
        # it is what TKT-01M29BW9Q1 and a future modernc fallback re-measure
        # against. Unlike the format spike its tests are assertions (the shared
        # DSN is honoured by both drivers, FTS5 and the Go tokenizer work), so
        # they run. The benchmark runs once at -benchtime=1x only to prove it
        # still runs; on a runner its numbers mean nothing.
        run: |
          go -C spikes/sqlite-driver vet ./...
          go -C spikes/sqlite-driver test -count=1 ./...
          go -C spikes/sqlite-driver test -run '^$' -bench ProjectionWrite \
            -benchtime=1x -bench.dir="$(mktemp -d)" -bench.allow-volatile-fs ./...

      - name: ticket store is consistent
        # AGENTS.md promises CI runs exactly this command, so it runs exactly
        # this command. It plans every repair, writes nothing, and exits 1 when
        # one is pending: a ticket under the wrong filename, a ticket in a
        # directory its status does not imply, a dangling parent or dependency,
        # a dependency cycle, an unresolved merge conflict in a ticket file.
        #
        # --strict is the flag doing the work. epics_index_stale is a warning,
        # so without it a stale .tickets/epics.md exits 0 and this step goes
        # green over a condition it is here to catch. It also fails on an
        # expired claim, and on a ticket in-progress with nobody holding it.
        #
        # The job reports the repair and never commits it, the same way it
        # reports unformatted code rather than reformatting behind your back.
        # Run `git ticket check --fix` locally and commit the result.
        #
        # `go install pkg@version` rather than a `tool` directive in go.mod:
        # `go get -tool` would pull git-ticket's TUI dependency graph into this
        # module and let a lint tool change what the shipped binary builds
        # against. `go install` builds outside the main module and touches
        # neither go.mod nor go.sum. GOBIN is explicit so this does not rest on
        # the image's PATH.
        run: |
          GOBIN=/usr/local/bin go install "github.com/terva-sh/git-ticket/cmd/git-ticket@${GIT_TICKET_VERSION}"
          git ticket check --fix --dry-run --strict
