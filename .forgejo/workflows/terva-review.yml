# Deployment example for the terva-sh Forgejo instance. See docs/pr-reviews.md.
#
# The reviewer is the terva-action-code-review image, v0.3.0, pinned by digest.
# It carries the action's source, prompt templates, locked dependencies and a
# checksum-pinned Terva, so this job checks out nothing and installs nothing:
# the job holding BOT_TOKEN and CPA_API_KEY runs no code from this repository
# or from the pull request.
name: terva-review
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Open same-repository PR number
        required: true
      request-id:
        description: Stable request ID; reuse for delivery retries
        required: true
        default: ready-review
      carry:
        description: true copies the last review's verdict to the head when later commits touch only .tickets/; no model runs
        required: false
        default: 'false'
concurrency:
  # Replace the maintainer list here AND in the job condition below.
  # Unlisted commenters never enter an authorized PR's serialized queue.
  group: terva-review-${{ github.repository }}-${{ inputs.pr || (contains(fromJSON('["warricksothr"]'), github.actor) && github.event.issue.number) || format('ignored-{0}', github.run_id) }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  review:
    # Parsing and authorization are repeated inside the reviewer.
    if: ${{ github.event_name != 'issue_comment' || (contains(fromJSON('["warricksothr"]'), github.actor) && github.event.issue.pull_request && startsWith(github.event.comment.body, '/terva ')) }}
    runs-on: docker
    container:
      # Pinned by digest, because a tag can be re-pushed and an executable pin
      # must not move. `podman pull <image>:v0.3.0` prints this digest; the
      # action's docs/installation.md#adopting-a-new-pin says what each
      # release changes.
      image: container.local.sothr.com/terva-sh/terva-action-code-review@sha256:35199d57112ea0048fe713a49c6087094c5bcbbeaa74d53d6dca89d9a8ba9cd7
      # The runner prepares its workspace inside the job container, and the
      # image's own user is unprivileged.
      options: --user root
    steps:
      - name: Review PR
        env:
          REVIEW_SERVER: ${{ github.server_url }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR: ${{ inputs.pr || github.event.issue.number }}
          # Manual requests only; command identity comes from comment ID/body.
          REVIEW_REQUEST_ID: ${{ inputs.request-id || 'automatic' }}
          REVIEW_FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
          REVIEW_PROVIDER_KEY: ${{ secrets.CPA_API_KEY }}
          # No defaults: terva-sh decides these once, as organization Actions
          # variables. An unset one fails the run naming it (missing_provider,
          # missing_model, missing_thinking, missing_provider_url).
          REVIEW_PROVIDER: ${{ vars.TERVA_REVIEW_PROVIDER }}
          REVIEW_BASE_URL: ${{ vars.TERVA_REVIEW_BASE_URL }}
          REVIEW_MODEL: ${{ vars.TERVA_REVIEW_MODEL }}
          REVIEW_THINKING: ${{ vars.TERVA_REVIEW_THINKING }}
          REVIEW_PROFILE: code
          REVIEW_PUBLICATION_POLICY: summary
          REVIEW_FAIL_SEVERITY: medium
          # A dispatch with carry: true writes the newest review's verdict on
          # the head when every commit since changed only these paths or the
          # excluded ones, and runs no model. Anything else refuses, and the
          # head's status names the path that needs a real review.
          REVIEW_CARRY: ${{ inputs.carry }}
          REVIEW_CARRY_PATHS: .tickets/**
        run: node /action/src/main.mjs
